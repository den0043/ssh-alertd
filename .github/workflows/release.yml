name: Build release draft

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      GOPROXY: 'off'
      GOSUMDB: 'off'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Create private scratch directory
        run: |
          scratch="$(mktemp -d "$RUNNER_TEMP/ssh-alertd.XXXXXX")"
          printf 'TMPDIR=%s\n' "$scratch" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: false
          cache: false
      - name: Formatting, vet, race and release-policy tests
        run: python3 -I -B scripts/check.py
      - name: Build and verify versioned assets
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ -n "$RELEASE_TAG" ]; then
            python3 -I -B scripts/release.py build --output dist --tag "$RELEASE_TAG"
          else
            python3 -I -B scripts/release.py build --output dist
          fi
      - name: Test the actual amd64 release binary
        run: |
          IFS= read -r version < VERSION
          SSH_ALERTD_BINARY="$PWD/dist/ssh-alertd-${version}-linux-amd64" python3 -I -B tests/runtime-test.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: false
          include-hidden-files: false

  draft:
    needs: check-and-build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Create private scratch directory
        run: |
          scratch="$(mktemp -d "$RUNNER_TEMP/ssh-alertd.XXXXXX")"
          printf 'TMPDIR=%s\n' "$scratch" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: dist/
          digest-mismatch: error
      - name: Verify, create a draft, download and compare exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python3 -I -B scripts/publish_draft.py --directory dist \
            --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" --commit "$RELEASE_COMMIT"
